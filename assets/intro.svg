<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="458" viewBox="0 0 1000 458" role="img" aria-label="About me">
<style>
  .h{font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#FFFFFF;letter-spacing:.14em}
  .h-lg{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#FFFFFF;letter-spacing:.14em}
  .body{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#D6D6D6}
</style>
<rect width="1000" height="458" rx="6" fill="#000000" stroke="#64101A"/>
<rect x="28" y="31" width="4" height="17" fill="#DF2531"/>
<text x="42" y="46" class="h">WHO I AM</text>
<line x1="151" y1="40" x2="972" y2="40" stroke="#DF2531" stroke-opacity=".45"/>
<text x="28" y="76" class="body">IT graduate based in Vietnam, working as a Software Developer (Full-stack &amp; AI) at iMBrace Limited.</text>
<rect x="28" y="105" width="4" height="17" fill="#DF2531"/>
<text x="42" y="120" class="h">WHAT I DO</text>
<line x1="162" y1="114" x2="972" y2="114" stroke="#DF2531" stroke-opacity=".45"/>
<text x="28" y="150" class="body">Shipped projects with Spring Boot, NestJS, Django, ReactJS &amp; Flutter.</text>
<text x="28" y="172" class="body">Focused on AI integration — chatbots, recommendation systems &amp; NLP.</text>
<rect x="28" y="201" width="4" height="17" fill="#DF2531"/>
<text x="42" y="216" class="h">CURRENTLY</text>
<line x1="162" y1="210" x2="972" y2="210" stroke="#DF2531" stroke-opacity=".45"/>
<text x="28" y="246" class="body">Sharpening clean architecture, system design &amp; deployment.</text>
<text x="28" y="268" class="body">Ask me about Backend, React, Docker, Firebase, or AI integration.</text>
<rect x="28" y="297" width="4" height="17" fill="#DF2531"/>
<text x="42" y="312" class="h">PRINCIPLES</text>
<line x1="174" y1="306" x2="972" y2="306" stroke="#DF2531" stroke-opacity=".45"/>
<text x="28" y="342" class="body">Clean over clever — readable code beats clever one-liners.</text>
<text x="28" y="364" class="body">Design before code — model the data and the flow first.</text>
<text x="28" y="386" class="body">Ship &amp; iterate — small commits, fast feedback loops.</text>
<text x="28" y="408" class="body">Own the bug — reproduce it, fix the root cause, add a guard.</text>
<text x="28" y="430" class="body">Learn in public — document, share, keep improving.</text>
