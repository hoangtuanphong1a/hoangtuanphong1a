<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="198" viewBox="0 0 1000 198" role="img" aria-label="Development journey">
<style>
  .card{fill:#ffffff;stroke:#d0d7de}
  .title{fill:#1f2328;font:600 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .desc{fill:#59636e;font:400 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .pill{font:600 11px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .row{fill:#1f2328;font:400 14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .date{fill:#59636e;font:400 13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .rule{stroke:#d0d7de}
  .year{fill:#54A6FF;font:700 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .jtitle{fill:#1f2328;font:600 14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .icon{font:18px 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
  @media (prefers-color-scheme: dark){
    .card{fill:#161b22;stroke:#30363d}
    .title,.row,.jtitle{fill:#e6edf3}
    .desc,.date{fill:#8b949e}
    .rule{stroke:#30363d}
  }
  .card.now{stroke:#54A6FF}
</style>
