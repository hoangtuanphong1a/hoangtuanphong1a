<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="205" viewBox="0 0 1000 205" role="img" aria-label="Development journey">
<style>
  .card{fill:#FFFFFF;stroke:#EAEAEA}
  .card.now{stroke:#DF2531}
  .tile{fill:#DF2531;fill-opacity:.1}
  .glyph{fill:none;stroke:#DF2531;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .title{fill:#000000;font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;letter-spacing:-.01em}
  .jtitle{fill:#000000;font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
  .desc{fill:#6B6B6B;font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
  .row{fill:#111111;font:400 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
  .meta{fill:#DF2531;font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;letter-spacing:.08em}
  .bullet{fill:#111111;font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
  .rule{stroke:#EAEAEA}
  .dot{fill:#DF2531}
  .halo{fill:#DF2531;fill-opacity:.25}
  .tag{font:600 10px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;letter-spacing:.06em}
  .t-ink rect{fill:#000000;fill-opacity:.06} .t-ink text,.t-ink path{fill:#111111}
  .t-red rect{fill:#DF2531;fill-opacity:.12} .t-red text,.t-red path{fill:#DF2531}
  @media (prefers-color-scheme: dark){
    .card{fill:#000000;stroke:#DF2531;stroke-opacity:.45}
    .card.now{stroke:#DF2531;stroke-opacity:1}
    .tile{fill-opacity:.18}
    .glyph{stroke:#FF5C66}
    .title,.jtitle{fill:#FFFFFF}
    .desc{fill:#A3A3A3}
    .row,.bullet{fill:#E6E6E6}
    .meta{fill:#FF5C66}
    .rule{stroke:#DF2531;stroke-opacity:.35}
    .dot{fill:#FFFFFF}
    .halo{fill-opacity:.55}
    .t-ink rect{fill:#FFFFFF;fill-opacity:.08} .t-ink text,.t-ink path{fill:#FFFFFF}
    .t-red rect{fill:#DF2531;fill-opacity:.25} .t-red text,.t-red path{fill:#FF5C66}
  }
</style>
