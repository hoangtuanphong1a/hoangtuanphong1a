name: Generate README

on:
  push:
    branches: [main]
    paths: ['readme.source.md']
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate README
        uses: collectioneur/readme-aura@74268b4e310b8f4074e8a9c5a8e5e5210dd3436a  # v1.0.20
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
